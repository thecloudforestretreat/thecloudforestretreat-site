<!-- WhatsApp Smart CTA (TCFR) -->
<div class="tcfrWaFab" aria-label="WhatsApp contact">
  <button class="tcfrWaBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="WhatsApp">
    <img class="tcfrWaImg"
         alt="Chat on WhatsApp"
         loading="lazy"
         decoding="async">
  </button>

  <div class="tcfrWaBackdrop" tabindex="-1" aria-hidden="true"></div>

  <div class="tcfrWaPanel" role="dialog" aria-label="WhatsApp options">
    <div class="tcfrWaHead">
      <div class="tcfrWaTitle">Chat with us on WhatsApp</div>
      <button class="tcfrWaClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="tcfrWaActions">
      <a class="tcfrWaAction" href="#" data-wa-template="Hi! I want to check availability. Page: {url}">Check availability</a>
      <a class="tcfrWaAction" href="#" data-wa-template="Hi! I want to book a reservation. Page: {url}">Book a reservation</a>
      <a class="tcfrWaAction" href="#" data-wa-template="Hi! I have a transportation question. Page: {url}">Transportation</a>
      <a class="tcfrWaAction" href="#" data-wa-template="Hi! I have a question. Page: {url}">Questions</a>
    </div>
  </div>
</div>
